<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aeropéndulo invertido — Jarapis Lab</title>
  <meta name="description" content="Gemelo digital del aeropéndulo invertido de dos motores: modelo, simulador, instrumentación y manual de usuario. Proyecto Instrumental 1, Universidad EAFIT, 2026-2."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg:    #0D0D0D;
      --bg2:   #111418;
      --bg3:   #161c22;
      --red:   #F46008;
      --white: #F0EEE9;
      --g1:    #8a8a8a;
      --g2:    #555;
      --g3:    #2e2e2e;
      --blue:  #4A9EFF;
      --mono:  'JetBrains Mono', 'IBM Plex Mono', monospace;
      --sans:  'Inter', -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: var(--red); }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    section { position: relative; }

    .katex { font-size: 1em !important; color: var(--white); }
    .katex-display { margin: 0.4em 0; }

    /* ── Responsive layout classes ── */
    .s-pad { padding: 120px 80px; }
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; max-width: 1400px; margin: 0 auto; width: 100%; position: relative; z-index: 1; }
    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .g2-tight { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
    .g4-stats { display: grid; grid-template-columns: repeat(4,1fr); border: 1px solid #1e1e1e; margin-bottom: 44px; }
    .g4-footer { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 64px; }
    .spec-header { display: grid; grid-template-columns: 2fr 3fr 2fr; padding: 10px 24px; background: #0a0a0a; border-bottom: 1px solid var(--red); }
    .spec-row { display: grid; grid-template-columns: 2fr 3fr 2fr; padding: 14px 24px; border-bottom: 1px solid #161616; align-items: center; }
    .spec-note { display: block; }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .hamburger { display: none; }

    @media (max-width: 960px) {
      .s-pad { padding: 80px 32px; }
      .hero-grid { grid-template-columns: 1fr; gap: 48px; }
      .hero-svg-wrap { order: -1; max-width: 420px; margin: 0 auto; }
      .g2 { grid-template-columns: 1fr; gap: 24px; }
      .g2-tight { grid-template-columns: 1fr; }
      .g3 { grid-template-columns: 1fr 1fr; }
      .g4-footer { grid-template-columns: 1fr 1fr; gap: 28px; }
      .spec-note { display: none; }
      .spec-header { grid-template-columns: 1fr 1fr; }
      .spec-header span:last-child { display: none; }
      .spec-row { grid-template-columns: 1fr 1fr; }
      .spec-row span:last-child { display: none; }
    }

    @media (max-width: 600px) {
      .s-pad { padding: 64px 20px; }
      .g3 { grid-template-columns: 1fr; }
      .g4-stats { grid-template-columns: 1fr 1fr; }
      .g4-footer { grid-template-columns: 1fr; gap: 24px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .hero-title { font-size: clamp(52px,16vw,88px) !important; }
      .mobile-menu-open .nav-links {
        display: flex; flex-direction: column; align-items: flex-start;
        position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
        background: rgba(13,13,13,0.98); padding: 32px 24px; gap: 20px; z-index: 199;
        border-top: 1px solid #222;
      }
    }
  
    .hero-grid > *, .g2 > *, .g2-tight > *, .g3 > *, .g4 > *, .io-grid > *{ min-width:0; }
    .g4{ display:grid; grid-template-columns:repeat(4,1fr); gap:2px; }
    .io-grid{ display:grid; grid-template-columns:1fr 60px 1.3fr 60px 1fr; align-items:stretch; gap:0; }
    .fig-card{ background:#0a0a0a; border:1px solid #1a1a1a; }
    .fig-card img{ display:block; width:100%; height:auto; }
    .fig-cap{ font-family:var(--sans); font-size:13px; color:#9c9992; line-height:1.55; padding:12px 16px; }
    details > summary::marker{ color:var(--red); }
    @media (max-width: 960px){ #specs-parts, #elec-grid, #sw-grid, #sw-grid2{ grid-template-columns:1fr !important; } }
    @media (max-width: 960px){ .g4{ grid-template-columns:1fr 1fr; } .io-grid{ grid-template-columns:1fr; } .io-arrow{ transform:rotate(90deg); } }
    @media (max-width: 600px){ .g4{ grid-template-columns:1fr; } }
  </style>
</head>
<body>

</body>
</html>
